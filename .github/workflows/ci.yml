name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Lint protos
        run: nix develop --command buf lint

      - name: Check Go bindings are current
        run: |
          nix develop --command buf generate
          git diff --exit-code

      - name: Test Go
        run: nix develop --command go test ./...

      - name: Lint Rust
        run: |
          nix develop --command cargo fmt --check
          nix develop --command cargo clippy --all-targets

      # Includes tests/generated.rs, which fails if src/generated is stale.
      - name: Test Rust
        run: nix develop --command cargo test

  # Publishes the protos as buf.build/protoc-contrib/protoc-types on every
  # merge to main, labelled main and linked to the commit. --create makes the
  # first push create the module, public like the plugins that read it.
  publish:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@v22

      - name: Push to Buf Schema Registry
        run: |
          nix develop --command \
            buf push --git-metadata --create --create-visibility public
        env:
          BUF_TOKEN: ${{ secrets.BUF_TOKEN }}
