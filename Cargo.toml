[package]
name = "protoc-types"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "The protoc.contrib proto packages compiled for buffa: the options the protoc-contrib plugins read."
repository = "https://github.com/protoc-contrib/protoc-types"
# Taken from GitHub, not crates.io, pinned to a rev.
publish = false
# Lets the build scripts of dependent crates find the protos, as
# DEP_PROTOC_TYPES_PROTO; see build.rs.
links = "protoc-types"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }

[dependencies]
# Keep on the minor the committed code in src/generated was generated for: it
# targets a specific runtime API, so a mismatch fails to compile rather than
# degrading.
buffa = "0.9.2"

[dev-dependencies]
# Regenerates src/generated, to check it is current; see tests/generated.rs.
buffa-build = "0.9.2"
