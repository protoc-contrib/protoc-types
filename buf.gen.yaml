# Regenerates the Go bindings beside their protos. The Rust bindings in
# src/generated are regenerated by `UPDATE_GENERATED=1 cargo test --test
# generated` instead; see tests/generated.rs.
version: v2
plugins:
  - local: [go, tool, protoc-gen-go]
    out: .
    opt:
      - module=github.com/protoc-contrib/protoc-types
